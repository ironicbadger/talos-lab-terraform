---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  chart:
    spec:
      chart: headlamp
      # 0.40.1 repeatedly times out on m720q during Helm upgrade; pin to the
      # last known-good release until the upgrade path is verified.
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    clusterRoleBinding:
      create: true
    config:
      oidc:
        issuerURL: https://idp.ktz.ts.net
        scopes: "openid profile email"
        # callbackURL set in overlay
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
